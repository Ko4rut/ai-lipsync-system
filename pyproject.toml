[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lipsync-system"
version = "0.1.0"
description = "Reproducible audio-driven lip synchronization experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lipsync = "lipsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
