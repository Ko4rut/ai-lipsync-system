[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lipsync-system"
version = "0.1.0"
description = "Planning skeleton for an audio-driven lip synchronization research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lipsync = "lipsync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that read the real dataset when configured",
]
