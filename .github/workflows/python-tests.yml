name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Avoid downloading the large CUDA build on an Ubuntu runner.
      # requirements.txt allows an existing compatible torch installation.
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e .

      # Real GRID integration tests skip when LIPSYNC_DATA_ROOT is unset.
      # Never add a private Google Drive path or dataset media to CI.
      - name: Run test suite
        run: python -m pytest tests/ -v -ra
